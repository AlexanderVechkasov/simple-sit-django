{# Сама форма — отдельным файлом: её же вставим в окно на шаге 3 #}
<form class="feedback-form" method="post" action="{% url 'feedback:form' %}" novalidate>
    {% csrf_token %}

    {% if form.errors %}
        <p class="form-summary" role="alert">Сообщение не отправлено — проверьте поля ниже.</p>
    {% endif %}

    {% for field in form %}
        <div class="form-field">
            {{ field.as_field_group }}
        </div>
    {% endfor %}

    <div>
        <button type="submit" class="read-more">Отправить</button>
    </div>
</form>
