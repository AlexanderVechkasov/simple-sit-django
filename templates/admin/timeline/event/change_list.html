{% extends "admin/change_list.html" %}

{% block filters %}
    {{ block.super }}

    <div class="list-toolbar" role="group" aria-label="Действия с выбранными событиями"
         data-list-toolbar hidden>
        {% if perms.timeline.change_event %}
            <button type="button" class="list-tool" data-tool="edit" data-needs="one" disabled>
                <span class="material-symbols-outlined" aria-hidden="true">edit</span>Изменить
            </button>
        {% endif %}
        {% if perms.timeline.delete_event %}
            <button type="button" class="list-tool danger" data-tool="delete" disabled>
                <span class="material-symbols-outlined" aria-hidden="true">delete</span>Удалить
            </button>
        {% endif %}
        <span class="list-toolbar-status" role="status">Отметьте записи галочками</span>
    </div>
{% endblock %}
