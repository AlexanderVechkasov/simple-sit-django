[project]
name = "simple-sit-django"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-cleanup>=9.0.0",
    "django-environ>=0.14.0",
    "django-unfold>=0.110.1",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

# --- Ruff: проверка кода (uv run ruff check .) ---
[tool.ruff]
line-length = 100                    # максимальная длина строки
extend-exclude = ["*/migrations/*"]  # миграции Django создаёт сам — их не трогаем

[tool.ruff.lint]
select = [
    "E", "W",  # стиль кода (PEP 8)
    "F",       # ошибки: неиспользуемые импорты и переменные, опечатки в именах
    "I",       # порядок импортов
    "B",       # частые ловушки и баги
    "UP",      # устаревшие способы записи для нашей версии Python
    "DJ",      # правила для Django
]
